<!doctype html>
<!-- PLANTILLA «comparacion» · dos cosas que se contraponen o se confunden (A arriba, B abajo) y un desenlace.
     Visuales (catálogo cerrado): cronometro · barra · pedestal · lupa · silueta · reloj_arena · rayo · semilla -->
<html
  data-composition-variables='[
    {"id":"numero","type":"number","label":"Número de recordatorio (0 = sin número)","default":1},
    {"id":"a_etiqueta","type":"string","label":"Etiqueta A","default":"DECIDIR"},
    {"id":"a_visual","type":"string","label":"Visual A","default":"cronometro"},
    {"id":"a_velocidad","type":"string","label":"Ritmo A (rapida/lenta/vacío)","default":""},
    {"id":"b_etiqueta","type":"string","label":"Etiqueta B","default":"RESULTADOS"},
    {"id":"b_visual","type":"string","label":"Visual B","default":"barra"},
    {"id":"b_velocidad","type":"string","label":"Ritmo B (rapida/lenta/vacío)","default":""},
    {"id":"desenlace","type":"string","label":"Desenlace","default":"Confundirlas te cuesta años"},
    {"id":"t1","type":"number","label":"Inicio frase 2 (s)","default":2.2},
    {"id":"t2","type":"number","label":"Inicio última frase (s)","default":4.6},
    {"id":"dur","type":"number","label":"Duración escena (s)","default":7}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Jost"; src: url("public/fonts/Jost-var.ttf") format("truetype"); font-weight: 100 900; }
        #root[data-composition-id="__ID__"] { position: absolute; inset: 0; font-family: "Jost", sans-serif; color: #fff; }
        [data-composition-id="__ID__"] .kicker { position: absolute; left: 96px; top: 300px; font-size: 34px; font-weight: 600; letter-spacing: .14em; color: #d4e6a5; }
        [data-composition-id="__ID__"] .panel { position: absolute; left: 96px; right: 96px; height: 360px; border: 2px solid #2a2e2b; border-radius: 28px; display: flex; align-items: center; gap: 48px; padding: 0 56px; background: #161917; }
        [data-composition-id="__ID__"] .pa { top: 400px; }
        [data-composition-id="__ID__"] .pb { top: 800px; }
        [data-composition-id="__ID__"] .ico { width: 240px; height: 240px; flex: none; display: block; }
        [data-composition-id="__ID__"] .lbl { font-size: 64px; font-weight: 700; letter-spacing: .02em; line-height: 1.05; }
        [data-composition-id="__ID__"] .sub { font-size: 34px; font-weight: 400; color: #9a9e9a; margin-top: 8px; }
        [data-composition-id="__ID__"] .vs { position: absolute; left: 0; right: 0; top: 763px; text-align: center; font-size: 30px; font-weight: 600; color: #9a9e9a; letter-spacing: .2em; }
        [data-composition-id="__ID__"] .remate { position: absolute; left: 96px; right: 96px; top: 1250px; font-size: 66px; font-weight: 600; line-height: 1.12; }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
        <div class="kicker" id="__ID__-kicker"></div>
        <div class="panel pa" id="__ID__-pa"><svg class="ico" id="__ID__-ia" viewBox="0 0 240 240"></svg><div><div class="lbl" id="__ID__-la"></div><div class="sub" id="__ID__-sa"></div></div></div>
        <div class="vs" id="__ID__-vs">FRENTE A</div>
        <div class="panel pb" id="__ID__-pb"><svg class="ico" id="__ID__-ib" viewBox="0 0 240 240"></svg><div><div class="lbl" id="__ID__-lb"></div><div class="sub" id="__ID__-sb"></div></div></div>
        <div class="remate" id="__ID__-remate"></div>
      </div>
      <script>
        (function () {
          const ID = "__ID__", ACENTO = "#d4e6a5", TRAZO = "#e9ece9";
          const $ = (k) => document.getElementById(ID + "-" + k);
          const v = window.__hyperframes.getVariables();
          const n = Number(v.numero) || 0;
          $("kicker").textContent = n ? "RECORDATORIO " + String(n).padStart(2, "0") : "";
          $("la").textContent = v.a_etiqueta || ""; $("lb").textContent = v.b_etiqueta || "";
          $("sa").textContent = v.a_velocidad === "rapida" ? "rápido" : v.a_velocidad === "lenta" ? "con paciencia" : "";
          $("sb").textContent = v.b_velocidad === "rapida" ? "rápido" : v.b_velocidad === "lenta" ? "con paciencia" : "";
          $("remate").textContent = v.desenlace || "";
          const t1 = Number(v.t1) || 2, t2 = Math.max(t1 + 1.2, Number(v.t2) || 4.5), dur = Number(v.dur) || 7;
          const NS = "http://www.w3.org/2000/svg";
          const el = (svg, tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
          // Catálogo de iconos: dibujan y devuelven su animación «en marcha» (rápida o lenta).
          const ICONOS = {
            cronometro(svg, tl, t, rapido) {
              el(svg, "circle", { cx: 120, cy: 130, r: 88, fill: "none", stroke: TRAZO, "stroke-width": 10 });
              el(svg, "rect", { x: 108, y: 22, width: 24, height: 20, rx: 4, fill: TRAZO });
              const m = el(svg, "line", { x1: 120, y1: 130, x2: 120, y2: 62, stroke: ACENTO, "stroke-width": 10, "stroke-linecap": "round" });
              tl.fromTo(m, { rotation: 0, svgOrigin: "120 130" }, { rotation: rapido ? 360 * 3 : 120, svgOrigin: "120 130", duration: dur - t, ease: "none" }, t);
            },
            barra(svg, tl, t, rapido) {
              el(svg, "rect", { x: 12, y: 100, width: 216, height: 44, rx: 22, fill: "none", stroke: TRAZO, "stroke-width": 8 });
              const f = el(svg, "rect", { x: 22, y: 110, width: 196, height: 24, rx: 12, fill: ACENTO });
              tl.fromTo(f, { scaleX: 0.02, svgOrigin: "22 122" }, { scaleX: rapido ? 1 : 0.32, svgOrigin: "22 122", duration: dur - t, ease: rapido ? "power2.out" : "none" }, t);
            },
            silueta(svg) { el(svg, "circle", { cx: 120, cy: 70, r: 34, fill: TRAZO }); el(svg, "path", { d: "M58 220 Q60 120 120 116 Q180 120 182 220 Z", fill: TRAZO }); },
            pedestal(svg, tl, t) {
              const g = el(svg, "g", {});
              el(g, "circle", { cx: 120, cy: 38, r: 22, fill: TRAZO }); el(g, "path", { d: "M84 130 Q86 66 120 64 Q154 66 156 130 Z", fill: TRAZO });
              el(svg, "rect", { x: 70, y: 134, width: 100, height: 96, fill: "#3a3f3b" }); el(svg, "rect", { x: 56, y: 126, width: 128, height: 14, fill: "#4a504b" });
              tl.fromTo(g, { y: 30 }, { y: 0, duration: 0.8, ease: "power2.out" }, t);
            },
            lupa(svg, tl, t) {
              el(svg, "circle", { cx: 100, cy: 150, r: 26, fill: TRAZO }); el(svg, "path", { d: "M62 232 Q64 176 100 174 Q136 176 138 232 Z", fill: TRAZO });
              const g = el(svg, "g", {});
              el(g, "circle", { cx: 150, cy: 92, r: 56, fill: "rgba(212,230,165,.12)", stroke: ACENTO, "stroke-width": 10 });
              el(g, "line", { x1: 190, y1: 132, x2: 228, y2: 170, stroke: ACENTO, "stroke-width": 14, "stroke-linecap": "round" });
              tl.fromTo(g, { x: 30, y: -20 }, { x: -40, y: 40, duration: Math.max(1, dur - t - 0.5), ease: "sine.inOut" }, t);
            },
            reloj_arena(svg, tl, t) {
              el(svg, "path", { d: "M60 20 H180 M60 220 H180 M70 20 Q70 110 120 120 Q170 110 170 20 M70 220 Q70 130 120 120 Q170 130 170 220", fill: "none", stroke: TRAZO, "stroke-width": 9 });
              const a = el(svg, "path", { d: "M84 200 Q120 150 156 200 Z", fill: ACENTO });
              tl.fromTo(a, { scaleY: 0.1, svgOrigin: "120 200" }, { scaleY: 1, svgOrigin: "120 200", duration: dur - t, ease: "none" }, t);
            },
            rayo(svg, tl, t) { const p = el(svg, "path", { d: "M138 12 L60 132 H118 L98 228 L182 98 H124 Z", fill: ACENTO }); tl.fromTo(p, { scale: 0.6, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, t); },
            semilla(svg, tl, t) {
              el(svg, "path", { d: "M30 210 H210", stroke: TRAZO, "stroke-width": 8 });
              const p = el(svg, "path", { d: "M120 208 V110 M120 150 Q80 140 76 104 Q112 108 120 150 M120 130 Q160 120 164 84 Q128 88 120 130", fill: "none", stroke: ACENTO, "stroke-width": 9, "stroke-linecap": "round" });
              tl.fromTo(p, { scaleY: 0.05, svgOrigin: "120 208" }, { scaleY: 1, svgOrigin: "120 208", duration: dur - t, ease: "none" }, t);
            },
          };
          const tl = gsap.timeline({ paused: true });
          const pinta = (svg, nombre, t, vel) => (ICONOS[nombre] || ICONOS.silueta)(svg, tl, t, vel !== "lenta");
          tl.fromTo($("kicker"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
          // A entra con la 1.ª frase; B con la 2.ª; el desenlace con la última.
          tl.fromTo($("pa"), { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.2);
          pinta($("ia"), v.a_visual, 0.5, v.a_velocidad);
          tl.fromTo($("vs"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, Math.max(0.6, t1 - 0.4));
          tl.fromTo($("pb"), { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, t1);
          pinta($("ib"), v.b_visual, t1 + 0.3, v.b_velocidad);
          // Desenlace: los paneles se apagan un poco y el remate toma el foco.
          tl.to([$("pa"), $("pb"), $("vs")], { opacity: 0.45, duration: 0.5 }, t2);
          tl.fromTo($("remate"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, t2);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
