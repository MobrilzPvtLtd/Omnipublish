<!doctype html>
<!-- PLANTILLA «idea_simple» (comodín) · una idea que no encaja en otra plantilla: titular palabra a palabra + apoyo. -->
<html
  data-composition-variables='[
    {"id":"numero","type":"number","label":"Número de recordatorio (0 = sin número)","default":0},
    {"id":"titular","type":"string","label":"Titular","default":"Una idea clara"},
    {"id":"apoyo","type":"string","label":"Frase de apoyo","default":""},
    {"id":"t1","type":"number","label":"Inicio frase 2 (s)","default":2.5},
    {"id":"t2","type":"number","label":"Inicio última frase (s)","default":2.5},
    {"id":"dur","type":"number","label":"Duración escena (s)","default":6}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Jost"; src: url("public/fonts/Jost-var.ttf") format("truetype"); font-weight: 100 900; }
        #root[data-composition-id="__ID__"] { position: absolute; inset: 0; font-family: "Jost", sans-serif; color: #fff; }
        [data-composition-id="__ID__"] .kicker { position: absolute; left: 96px; top: 300px; font-size: 34px; font-weight: 600; letter-spacing: .14em; color: #d4e6a5; }
        [data-composition-id="__ID__"] .tit { position: absolute; left: 96px; right: 96px; top: 520px; font-size: 110px; font-weight: 700; line-height: 1.04; letter-spacing: -.02em; }
        [data-composition-id="__ID__"] .w { display: inline-block; margin-right: .24em; }
        [data-composition-id="__ID__"] .apoyo { position: absolute; left: 96px; right: 96px; top: 1150px; font-size: 56px; font-weight: 500; color: #d4e6a5; line-height: 1.15; }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
        <div class="kicker" id="__ID__-kicker"></div>
        <div class="tit" id="__ID__-tit"></div>
        <div class="apoyo" id="__ID__-apoyo"></div>
      </div>
      <script>
        (function () {
          const ID = "__ID__";
          const $ = (k) => document.getElementById(ID + "-" + k);
          const v = window.__hyperframes.getVariables();
          const n = Number(v.numero) || 0;
          $("kicker").textContent = n ? "RECORDATORIO " + String(n).padStart(2, "0") : "";
          const e = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
          $("tit").innerHTML = String(v.titular || "").split(/\s+/).filter(Boolean).map((w) => '<span class="w">' + e(w) + "</span>").join("");
          $("apoyo").textContent = v.apoyo || "";
          const t2 = Number(v.t2) || 2.5;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($("kicker"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
          const ws = $("tit").children;
          tl.fromTo(ws, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, stagger: Math.min(0.18, Math.max(0.06, (t2 - 0.6) / Math.max(1, ws.length))), ease: "power3.out" }, 0.2);
          tl.fromTo($("apoyo"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, t2);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
