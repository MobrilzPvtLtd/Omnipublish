<!doctype html>
<!-- PLANTILLA «gancho_foto_sello» · gancho con la cara de la marca: foto con zoom lento, un calendario que
     estampa una palabra una y otra vez (el hábito) y el titular de la lista. -->
<html
  data-composition-variables='[
    {"id":"foto","type":"string","label":"Foto (ruta del proyecto)","default":"public/autor.png"},
    {"id":"sello_repetido","type":"string","label":"Palabra que se repite","default":"MAÑANA"},
    {"id":"titular","type":"string","label":"Titular","default":"9 recordatorios"},
    {"id":"t1","type":"number","label":"Inicio frase 2 (s)","default":2.6},
    {"id":"t2","type":"number","label":"Inicio última frase (s)","default":2.6},
    {"id":"dur","type":"number","label":"Duración escena (s)","default":6}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Jost"; src: url("public/fonts/Jost-var.ttf") format("truetype"); font-weight: 100 900; }
        #root[data-composition-id="__ID__"] { position: absolute; inset: 0; font-family: "Jost", sans-serif; color: #fff; }
        [data-composition-id="__ID__"] .marco { position: absolute; left: 96px; right: 96px; top: 300px; height: 760px; border-radius: 32px; overflow: hidden; background: #1a1d1b; }
        [data-composition-id="__ID__"] .foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        [data-composition-id="__ID__"] .velo { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,19,18,0) 45%, rgba(17,19,18,.85) 100%); }
        [data-composition-id="__ID__"] .cal { position: absolute; right: 48px; top: 48px; width: 300px; height: 330px; border-radius: 22px; background: #f3f4f1; color: #111312; box-shadow: 0 30px 60px rgba(0,0,0,.45); overflow: hidden; }
        [data-composition-id="__ID__"] .cal-top { height: 64px; background: #d4e6a5; }
        [data-composition-id="__ID__"] .hoja { position: absolute; left: 0; right: 0; top: 64px; bottom: 0; display: flex; align-items: center; justify-content: center; background: #f3f4f1; transform-origin: 50% 0%; }
        [data-composition-id="__ID__"] .sello { font-size: 54px; font-weight: 800; letter-spacing: .04em; color: #b33a2f; border: 6px solid #b33a2f; border-radius: 12px; padding: 4px 16px; transform: rotate(-12deg); }
        [data-composition-id="__ID__"] .tit { position: absolute; left: 96px; right: 96px; top: 1110px; font-size: 104px; font-weight: 700; line-height: 1.02; letter-spacing: -.02em; }
        [data-composition-id="__ID__"] .tit b { color: #d4e6a5; font-weight: 700; }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
        <div class="marco" id="__ID__-marco">
          <img class="foto" id="__ID__-foto" src="public/autor.png" alt="" />
          <div class="velo"></div>
          <div class="cal" id="__ID__-cal"><div class="cal-top"></div><div id="__ID__-hojas"></div></div>
        </div>
        <div class="tit" id="__ID__-tit"></div>
      </div>
      <script>
        (function () {
          const ID = "__ID__";
          const $ = (k) => document.getElementById(ID + "-" + k);
          const v = window.__hyperframes.getVariables();
          if (v.foto) $("foto").src = v.foto;
          const t1 = Number(v.t1) || 2.6, dur = Number(v.dur) || 6;
          // Titular: el número inicial (si lo hay) en acento.
          const tit = String(v.titular || "");
          const m = tit.match(/^(\d+)\s+(.*)$/);
          $("tit").innerHTML = m ? "<b>" + m[1] + "</b> " + m[2].replace(/</g, "&lt;") : tit.replace(/</g, "&lt;");
          // 4 hojas con el mismo sello: el hábito de aplazar, una y otra vez.
          const N = 4, cont = $("hojas");
          // El sello SIEMPRE dentro de la hoja (300 px, girado): letra según la longitud de la palabra
          // (≈0,8 em por mayúscula en Jost 800; se calcula, no se mide, para que el render sea determinista).
          const palabra = String(v.sello_repetido || "");
          const fs = Math.min(54, Math.floor(196 / (Math.max(1, Array.from(palabra).length) * 0.8)));
          for (let i = 0; i < N; i++) {
            const h = document.createElement("div");
            h.className = "hoja"; h.style.zIndex = String(N - i);
            h.innerHTML = '<div class="sello" style="font-size:' + fs + 'px">' + palabra.replace(/</g, "&lt;") + "</div>";
            cont.appendChild(h);
          }
          const hojas = cont.children;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($("marco"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo($("foto"), { scale: 1.12 }, { scale: 1, duration: dur, ease: "none" }, 0);
          tl.fromTo($("cal"), { opacity: 0, y: -30, rotation: 6 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(2)" }, 0.25);
          // Durante la pregunta: sello… se arranca la hoja… otra vez el mismo sello.
          const paso = Math.max(0.45, (t1 - 0.9) / N);
          for (let i = 0; i < N; i++) {
            const s = hojas[i].firstChild, t = 0.55 + i * paso;
            tl.fromTo(s, { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.in" }, t);
            if (i < N - 1) tl.fromTo(hojas[i], { rotationX: 0, opacity: 1 }, { rotationX: -95, opacity: 0, duration: 0.3, ease: "power2.in" }, t + paso * 0.62);
          }
          tl.fromTo($("tit"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, t1);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
